name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project as exported doesn't include the gradlew script/jar
      # (only gradle/wrapper/gradle-wrapper.properties), so we let
      # gradle/actions/setup-gradle install the exact Gradle version that
      # file points at and invoke `gradle` directly instead of `./gradlew`.
      - name: Read required Gradle version
        id: gradle_version
        run: |
          VERSION=$(grep -oP 'distributionUrl=.*gradle-\K[0-9.]+(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          echo "version=$VERSION" >>
