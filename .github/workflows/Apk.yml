name: Build Android APK (Generate Wrapper, Keystore & Build)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up System Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.7.1

      - name: Make Wrapper Executable
        run: chmod +x gradlew

      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore dummy.jks -keyalg RSA -keysize 2048 -validity 10000 -alias dummy_alias -storepass dummy_password -keypass dummy_password -dname "CN=Dummy, OU=Dummy, O=Dummy, L=Dummy, S=Dummy, C=US"

      - name: Build Signed Release APK
        run: >
          ./gradlew assembleRelease 
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/dummy.jks 
          -Pandroid.injected.signing.store.password=dummy_password 
          -Pandroid.injected.signing.key.alias=dummy_alias 
          -Pandroid.injected.signing.key.password=dummy_password

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          
