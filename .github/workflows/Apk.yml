name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project as exported doesn't include the gradlew script/jar
      # (only gradle/wrapper/gradle-wrapper.properties), so we let
      # gradle/actions/setup-gradle install the exact Gradle version that
      # file points at and invoke `gradle` directly instead of `./gradlew`.
        - name: Read required Gradle version
        id: gradle_version
        run: |
          VERSION=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "Detected Gradle version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
