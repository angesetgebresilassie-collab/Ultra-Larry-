name: Build Android APK

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Switched to Eclipse Temurin OpenJDK
          java-version: '17'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: |
          # Uses the system's global gradle to recreate your local wrapper script
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
